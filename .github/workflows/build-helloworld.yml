name: 构建 helloworld 预编译组件

on:
  workflow_dispatch:
    inputs:
      openwrt_version:
        description: "OpenWrt 官方发布版本 (输入 latest 自动拉取最新稳定版，或指定如 25.12.5)"
        required: true
        default: "latest"
      force_rebuild:
        description: "是否强制重新编译 (即使已有相同版本产物)"
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      openwrt_version:
        description: "OpenWrt 官方发布版本"
        required: true
        type: string
      force_rebuild:
        description: "是否强制重新编译"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: 编译 helloworld 组件 (x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: 检出代码仓库
        uses: actions/checkout@v5

      - name: 初始化编译依赖环境
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            binutils \
            clang \
            flex \
            bison \
            bzip2 \
            g++ \
            gcc-multilib \
            g++-multilib \
            libncurses-dev \
            zlib1g-dev \
            gawk \
            git \
            gettext \
            libssl-dev \
            rsync \
            unzip \
            wget \
            curl \
            file \
            patch \
            tar \
            zstd \
            python3

      - name: 解析 OpenWrt 版本
        id: meta
        env:
          REQUESTED_VERSION: ${{ inputs.openwrt_version || github.event.inputs.openwrt_version || 'latest' }}
        run: |
          chmod +x scripts/*.sh
          version="$(./scripts/resolve-version.sh "${REQUESTED_VERSION}")"
          echo "OPENWRT_VERSION=${version}" >> $GITHUB_ENV
          echo "version=${version}" >> $GITHUB_OUTPUT
          echo "==> 锁定的 OpenWrt 版本: ${version}"

      - name: 缓存官方构建工具与源码下载
        uses: actions/cache@v5
        with:
          path: |
            .work/*.tar.zst
            .work/downloads
            .work/helloworld-source
          key: openwrt-sdk-x86_64-${{ steps.meta.outputs.version }}-${{ hashFiles('components/helloworld-builder/**') }}
          restore-keys: |
            openwrt-sdk-x86_64-${{ steps.meta.outputs.version }}-

      - name: 准备官方 SDK 环境并校验 Checksum
        id: sdk_setup
        env:
          CUSTOM_SIGNING_KEY: ${{ secrets.CUSTOM_SIGNING_KEY }}
        run: |
          mkdir -p .work
          sdk_dir="$(./scripts/setup-sdk.sh "${OPENWRT_VERSION}" ".work")"
          [ -d "${sdk_dir}" ] && [ -f "${sdk_dir}/Makefile" ] || {
            echo "❌ 错误: SDK 准备失败，未找到有效 Makefile: ${sdk_dir}" >&2
            exit 1
          }
          echo "sdk_dir=${sdk_dir}" >> $GITHUB_OUTPUT
          echo "SDK_DIR=${sdk_dir}" >> $GITHUB_ENV

      - name: 编译 helloworld 组件
        id: build_step
        run: |
          mkdir -p .work
          OUTPUT_DIR=".work/helloworld-packages-${OPENWRT_VERSION}"
          OPENWRT_VERSION="${OPENWRT_VERSION}" \
          WORK_DIR=".work" \
          OUTPUT_DIR="${OUTPUT_DIR}" \
          SDK_DIR="${SDK_DIR}" \
          ./components/helloworld-builder/build.sh

          echo "output_dir=${OUTPUT_DIR}" >> $GITHUB_OUTPUT

      - name: 验证 helloworld 组件产物与元数据 (Hard Validation)
        run: |
          output_dir="${{ steps.build_step.outputs.output_dir }}"
          echo "==> 验证 helloworld 构建目录: ${output_dir}"

          # 1. 验证构建产物 APK 与 repository-packages.txt 一一对应
          shopt -s nullglob
          package_files=("${output_dir}"/*.apk)
          shopt -u nullglob
          [ ${#package_files[@]} -gt 0 ] || {
            echo "❌ 错误: helloworld 输出目录中没有 APK" >&2
            exit 1
          }

          while IFS='=' read -r pkg_name pkg_ver; do
            [ -n "${pkg_name}" ] || continue
            ls "${output_dir}/${pkg_name}"-*.apk >/dev/null 2>&1 || {
              echo "❌ 错误: 未找到 repository-packages.txt 中声明的 APK: ${pkg_name}" >&2
              exit 1
            }
          done < "${output_dir}/repository-packages.txt"

          # 验证核心目标包与依赖包均已生成
          for core_pkg in luci-app-ssr-plus luci-i18n-ssr-plus-zh-cn xray-core mihomo dns2tcp ipt2socks lua-neturl; do
            grep -Eq "^${core_pkg}=" "${output_dir}/repository-packages.txt" || {
              echo "❌ 错误: repository-packages.txt 中缺少核心目标: ${core_pkg}" >&2
              exit 1
            }
          done

          # 2. 严格校验 SHA256 校验和
          (cd "${output_dir}" && sha256sum --check --strict SHA256SUMS) || {
            echo "❌ 错误: helloworld SHA256 校验失败" >&2
            exit 1
          }

          # 3. 验证元数据与约束文件完整性
          for meta_file in BUILD-INFO.txt repository-packages.txt install-packages.txt install-constraints.txt helloworld-public-key.pem; do
            [ -s "${output_dir}/${meta_file}" ] || {
              echo "❌ 错误: 缺少元数据文件或文件为空: ${meta_file}" >&2
              exit 1
            }
          done

          echo "✓ helloworld 组件 Hard Validation 校验通过。"

      - name: 打包预编译组件产物
        id: package_step
        run: |
          output_dir="${{ steps.build_step.outputs.output_dir }}"
          COMPONENT_ARCHIVE="openwrt-component-helloworld-${OPENWRT_VERSION}-x86_64.tar.gz"
          tar -czf "${COMPONENT_ARCHIVE}" -C "${output_dir}" .
          echo "archive_path=${COMPONENT_ARCHIVE}" >> $GITHUB_OUTPUT

      - name: 上传构建产物至 Actions Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: helloworld-component-${{ steps.meta.outputs.version }}
          path: ${{ steps.package_step.outputs.archive_path }}
          retention-days: 1
