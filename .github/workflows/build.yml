name: 构建 OpenWrt 固件

on:
  schedule:
    # 每天北京时间 (UTC+8) 下午 12:15 准时自动触发构建 (即 04:15 UTC)
    - cron: '15 4 * * *'
  workflow_dispatch:
    inputs:
      openwrt_version:
        description: "OpenWrt 官方发布版本 (输入 latest 自动拉取最新稳定版，或指定如 25.12.5)"
        required: true
        default: "latest"
      rootfs_partsize:
        description: "根分区大小 ROOTFS_PARTSIZE (MB，默认 2048 即 2GB)"
        required: true
        default: "2048"
      grub_timeout:
        description: "GRUB 引导倒计时 (秒，默认 0 即开机不等待)"
        required: false
        default: "0"
      publish_release:
        description: "是否同时发布到 GitHub Releases (默认 false 不发布，仅保留在 Actions 产物中)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: 构建 OpenWrt x86_64 固件镜像
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: 检出代码仓库
        uses: actions/checkout@v5

      - name: 初始化编译依赖环境
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            binutils \
            clang \
            flex \
            bison \
            bzip2 \
            g++ \
            gcc-multilib \
            g++-multilib \
            libncurses-dev \
            zlib1g-dev \
            gawk \
            git \
            gettext \
            libssl-dev \
            rsync \
            unzip \
            wget \
            curl \
            file \
            patch \
            tar \
            zstd \
            python3

      - name: 锁定 OpenWrt 版本并生成构建时间戳
        id: version
        env:
          REQUESTED_OPENWRT_VERSION: ${{ github.event.inputs.openwrt_version || 'latest' }}
        run: |
          version="${REQUESTED_OPENWRT_VERSION}"
          if [ -z "$version" ] || [ "$version" = "latest" ]; then
            version=$(curl -fsSL --retry 3 --connect-timeout 15 \
              https://downloads.openwrt.org/.versions.json | \
              python3 -c 'import json,sys; print(json.load(sys.stdin)["stable_version"])')
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-rc[0-9]+)?$ ]]; then
            echo "无效的 OpenWrt 版本: $version" >&2
            exit 1
          fi
          BUILD_DATE=$(date +"%Y%m%d-%H%M")
          echo "OPENWRT_VERSION=${version}" >> $GITHUB_ENV
          echo "BUILD_DATE=${BUILD_DATE}" >> $GITHUB_ENV
          echo "version=${version}" >> $GITHUB_OUTPUT

      - name: 缓存官方构建工具与源码下载
        uses: actions/cache@v5
        with:
          path: |
            .work/*.tar.zst
            .work/downloads
          key: openwrt-sdk-x86_64-${{ steps.version.outputs.version }}-${{ hashFiles('scripts/build-helloworld.sh', 'scripts/build-fullcone.sh', 'fullcone/**') }}
          restore-keys: |
            openwrt-sdk-x86_64-${{ steps.version.outputs.version }}-

      - name: 恢复历史 Manifest 清单缓存
        uses: actions/cache/restore@v5
        with:
          path: /tmp/manifest_cache
          key: manifest-cache-x86_64-${{ github.run_id }}
          restore-keys: |
            manifest-cache-x86_64-

      - name: 执行固件编译打包
        env:
          ROOTFS_PARTSIZE: ${{ github.event.inputs.rootfs_partsize || '2048' }}
          GRUB_TIMEOUT: ${{ github.event.inputs.grub_timeout || '0' }}
        run: |
          chmod +x scripts/*.sh scripts/*.py
          mkdir -p .work
          if [ -d /tmp/manifest_cache ] && compgen -G "/tmp/manifest_cache/*.manifest" > /dev/null; then
            cp -f /tmp/manifest_cache/*.manifest .work/last-manifest.txt 2>/dev/null || true
          fi
          ./scripts/build.sh

      - name: 生成 Release 发布元数据与差分报告
        id: meta
        run: |
          # 自动从本次生成的 manifest 文件名中提取实际构建版本
          MANIFEST_PATH=$(find bin -maxdepth 1 -type f -name '*.manifest' -print -quit)
          ACTUAL_VERSION=$(basename "$MANIFEST_PATH" | sed -E 's/^openwrt-([0-9]+\.[0-9]+\.[0-9]+(-rc[0-9]+)?)-.*/\1/')
          if [ -z "$ACTUAL_VERSION" ]; then
            ACTUAL_VERSION="${{ steps.version.outputs.version }}"
          fi
          TAG_NAME="v${ACTUAL_VERSION}-${BUILD_DATE}"
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "release_title=OpenWrt ${ACTUAL_VERSION} x86_64 (${BUILD_DATE})" >> $GITHUB_OUTPUT
          echo "actual_version=${ACTUAL_VERSION}" >> $GITHUB_OUTPUT

          # 更新清单缓存供下一次对比
          mkdir -p /tmp/manifest_cache
          rm -rf /tmp/manifest_cache/*
          cp -f bin/*.manifest /tmp/manifest_cache/last.manifest 2>/dev/null || true

          # 读取差分报告注入 Release 内容
          DIFF_CONTENT=""
          if [ -f "bin/manifest.md" ]; then
            DIFF_CONTENT=$(cat bin/manifest.md)
          fi
          {
            echo "diff_content<<EOF"
            echo "$DIFF_CONTENT"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: 保存本次 Manifest 清单缓存
        uses: actions/cache/save@v5
        if: always()
        with:
          path: /tmp/manifest_cache
          key: manifest-cache-x86_64-${{ github.run_id }}

      - name: 上传构建产物至 Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: openwrt-x86_64-${{ steps.meta.outputs.tag_name }}
          path: bin/*
          retention-days: 30

      - name: 自动发布 GitHub Release
        if: ${{ github.event.inputs.publish_release == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag_name }}
          name: ${{ steps.meta.outputs.release_title }}
          draft: false
          prerelease: false
          files: |
            bin/*combined-efi*.img.gz*
            bin/sha256sums
            bin/*.manifest
            bin/manifest.diff
            bin/manifest.md
            bin/helloworld-build-info.txt
            bin/fullcone-build-info.txt
          body: |
            ## OpenWrt x86_64 UEFI 自动构建固件发布

            * **OpenWrt 版本**: `${{ steps.meta.outputs.actual_version }}`
            * **构建时间**: `${{ steps.meta.outputs.tag_name }}`
            * **适用环境**: FNOS (飞牛 OS) KVM / PVE / ESXi / 实体机 x86_64 (UEFI 引导)
            * **根分区大小**: `${{ github.event.inputs.rootfs_partsize || '2048' }} MB (2GB)`
            * **集成特性**:
              - 🚀 全套 LuCI 简体中文界面，默认启用现代侧边栏主题 (`luci-theme-footstrap`)
              - 📶 硬件直通网卡驱动: Realtek 2.5G (`r8125-rss`), 万兆 (`r8127-rss`), Wi-Fi 6/6E (`mt7921e`, `mt7922`)
              - 🖥️ 虚拟化来宾支持: `qemu-ga` (QEMU Guest Agent) 与 `open-vm-tools`
              - ⚡ 队列流控: SQM (带抗延迟 `CAKE` 算法)
              - 💻 网页终端: `ttyd`
              - 🌍 SSR Plus: 按 fw876/helloworld 官方 CI 从源码编译 `luci-app-ssr-plus`、`xray-core`、`mihomo`（排除 `naiveproxy`）
              - 🔄 FullCone NAT: 使用完全同版 OpenWrt SDK 编译 LEDE `nft_fullcone`、libnftnl、nftables 与 firewall4 调用链
              - 🕒 权威授时: 阿里云 / 腾讯云 / 国家授时中心 NTP
              - 🔑 安全加固: SSH 仅限 LAN 口监听并支持免密密钥认证

            ---

            ${{ steps.meta.outputs.diff_content }}
