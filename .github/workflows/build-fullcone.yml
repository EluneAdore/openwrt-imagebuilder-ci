name: 构建 FullCone 预编译组件

on:
  workflow_dispatch:
    inputs:
      openwrt_version:
        description: "OpenWrt 官方发布版本 (输入 latest 自动拉取最新稳定版，或指定如 25.12.5)"
        required: true
        default: "latest"
      force_rebuild:
        description: "是否强制重新编译 (即使已有相同版本产物)"
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      openwrt_version:
        description: "OpenWrt 官方发布版本"
        required: true
        type: string
      force_rebuild:
        description: "是否强制重新编译"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: 编译 FullCone 组件 (x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: 检出代码仓库
        uses: actions/checkout@v5

      - name: 初始化编译依赖环境
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            binutils \
            clang \
            flex \
            bison \
            bzip2 \
            g++ \
            gcc-multilib \
            g++-multilib \
            libncurses-dev \
            zlib1g-dev \
            gawk \
            git \
            gettext \
            libssl-dev \
            rsync \
            unzip \
            wget \
            curl \
            file \
            patch \
            tar \
            zstd \
            python3

      - name: 解析 OpenWrt 版本
        id: meta
        env:
          REQUESTED_VERSION: ${{ inputs.openwrt_version || github.event.inputs.openwrt_version || 'latest' }}
        run: |
          chmod +x scripts/*.sh
          version="$(./scripts/resolve-version.sh "${REQUESTED_VERSION}")"
          echo "OPENWRT_VERSION=${version}" >> $GITHUB_ENV
          echo "version=${version}" >> $GITHUB_OUTPUT
          echo "==> 锁定的 OpenWrt 版本: ${version}"

      - name: 缓存官方构建工具与源码下载
        uses: actions/cache@v5
        with:
          path: |
            .work/*.tar.zst
            .work/downloads
            .work/immortalwrt-source
            .work/luci-feed
          key: openwrt-sdk-fullcone-x86_64-${{ steps.meta.outputs.version }}-${{ hashFiles('components/fullcone-builder/**') }}
          restore-keys: |
            openwrt-sdk-fullcone-x86_64-${{ steps.meta.outputs.version }}-

      - name: 准备官方 SDK 环境并校验 Checksum
        id: sdk_setup
        env:
          CUSTOM_SIGNING_KEY: ${{ secrets.CUSTOM_SIGNING_KEY }}
        run: |
          mkdir -p .work
          sdk_dir="$(./scripts/setup-sdk.sh "${OPENWRT_VERSION}" ".work")"
          [ -d "${sdk_dir}" ] && [ -f "${sdk_dir}/Makefile" ] || {
            echo "❌ 错误: SDK 准备失败，未找到有效 Makefile: ${sdk_dir}" >&2
            exit 1
          }
          echo "sdk_dir=${sdk_dir}" >> $GITHUB_OUTPUT
          echo "SDK_DIR=${sdk_dir}" >> $GITHUB_ENV

      - name: 编译 FullCone 组件 (Runtime + LuCI)
        id: build_step
        run: |
          mkdir -p .work
          OUTPUT_BASE=".work/fullcone-component-${OPENWRT_VERSION}"
          RUNTIME_OUTPUT_DIR="${OUTPUT_BASE}/runtime"
          LUCI_OUTPUT_DIR="${OUTPUT_BASE}/luci"
          rm -rf "${OUTPUT_BASE}"
          mkdir -p "${RUNTIME_OUTPUT_DIR}" "${LUCI_OUTPUT_DIR}"

          echo "==> 编译 FullCone 运行时 APK (runtime)..."
          OPENWRT_VERSION="${OPENWRT_VERSION}" \
          WORK_DIR=".work" \
          OUTPUT_DIR="${RUNTIME_OUTPUT_DIR}" \
          SDK_DIR="${SDK_DIR}" \
          ./components/fullcone-builder/build.sh

          echo "==> 编译 FullCone LuCI APK (luci)..."
          OPENWRT_VERSION="${OPENWRT_VERSION}" \
          WORK_DIR=".work" \
          OUTPUT_DIR="${LUCI_OUTPUT_DIR}" \
          SDK_DIR="${SDK_DIR}" \
          ./components/fullcone-builder/build-luci.sh

          # 校验两阶段在同版 SDK 下签名公钥一致
          cmp -s "${RUNTIME_OUTPUT_DIR}/fullcone-public-key.pem" \
            "${LUCI_OUTPUT_DIR}/luci-fullcone-public-key.pem" || {
            echo "❌ 错误: FullCone runtime 与 LuCI APK 签名公钥不一致" >&2
            exit 1
          }

          echo "output_dir=${OUTPUT_BASE}" >> $GITHUB_OUTPUT

      - name: 验证 FullCone 组件产物与元数据 (Hard Validation)
        run: |
          output_dir="${{ steps.build_step.outputs.output_dir }}"
          echo "==> 验证 FullCone 构建产物目录: ${output_dir}"

          # 1. 验证 runtime 子目录与 4 个核心运行时 APK
          runtime_apks=(
            "kmod-nft-fullcone"
            "libnftnl11"
            "nftables-json"
            "firewall4"
          )
          for pkg in "${runtime_apks[@]}"; do
            ls "${output_dir}/runtime/${pkg}"-*.apk >/dev/null 2>&1 || {
              echo "❌ 错误: runtime 缺少必需 FullCone APK: ${pkg}" >&2
              exit 1
            }
          done
          (cd "${output_dir}/runtime" && sha256sum --check --strict SHA256SUMS) || {
            echo "❌ 错误: runtime SHA256 校验失败" >&2
            exit 1
          }
          for meta in BUILD-INFO.txt repository-packages.txt install-packages.txt install-constraints.txt kernel-dependency.txt fullcone-public-key.pem; do
            [ -s "${output_dir}/runtime/${meta}" ] || {
              echo "❌ 错误: runtime 缺少元数据文件或为空: ${meta}" >&2
              exit 1
            }
          done
          grep -Eq '^kernel=[0-9]+\.[0-9]+\.[0-9]+~[0-9a-f]+-r[0-9]+$' "${output_dir}/runtime/kernel-dependency.txt" || {
            echo "❌ 错误: runtime kernel-dependency.txt 格式无效" >&2
            exit 1
          }

          # 2. 验证 luci 子目录与 3 个 LuCI APK
          luci_apks=(
            "luci-base"
            "luci-app-firewall"
            "luci-i18n-firewall-zh-cn"
          )
          for pkg in "${luci_apks[@]}"; do
            ls "${output_dir}/luci/${pkg}"-*.apk >/dev/null 2>&1 || {
              echo "❌ 错误: luci 缺少必需 FullCone APK: ${pkg}" >&2
              exit 1
            }
          done
          (cd "${output_dir}/luci" && sha256sum --check --strict SHA256SUMS) || {
            echo "❌ 错误: luci SHA256 校验失败" >&2
            exit 1
          }
          for meta in BUILD-INFO.txt repository-packages.txt install-packages.txt install-constraints.txt luci-fullcone-public-key.pem; do
            [ -s "${output_dir}/luci/${meta}" ] || {
              echo "❌ 错误: luci 缺少元数据文件或为空: ${meta}" >&2
              exit 1
            }
          done
          grep -Fxq 'luci-i18n-firewall-zh-cn@custom' "${output_dir}/luci/install-constraints.txt" || {
            echo "❌ 错误: luci-i18n-firewall-zh-cn 未锁定到 @custom" >&2
            exit 1
          }

          # 3. 验证签名公钥一致性
          cmp -s "${output_dir}/runtime/fullcone-public-key.pem" "${output_dir}/luci/luci-fullcone-public-key.pem" || {
            echo "❌ 错误: runtime 与 luci 公钥不一致" >&2
            exit 1
          }

          echo "✓ FullCone runtime (4 APK) 与 luci (3 APK) 全部 Hard Validation 校验通过，无元数据覆盖风险。"

      - name: 打包预编译组件产物
        id: package_step
        run: |
          output_dir="${{ steps.build_step.outputs.output_dir }}"
          COMPONENT_ARCHIVE="openwrt-component-fullcone-${OPENWRT_VERSION}-x86_64.tar.gz"
          tar -czf "${COMPONENT_ARCHIVE}" -C "${output_dir}" runtime luci
          echo "archive_path=${COMPONENT_ARCHIVE}" >> $GITHUB_OUTPUT

      - name: 上传构建产物至 Actions Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: fullcone-component-${{ steps.meta.outputs.version }}
          path: ${{ steps.package_step.outputs.archive_path }}
          retention-days: 1
