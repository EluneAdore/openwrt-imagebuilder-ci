# ==============================================================================
# OpenWrt 自定义第三方软件源配置 (custom-feeds.conf)
# ==============================================================================
# 说明:
# 1. 本文件用于为 ImageBuilder 注入额外 APK 软件包仓库 (OpenWrt 25.12+ 使用 apk)。
# 2. 构建脚本 (scripts/build.sh) 会自动解析非注释行，并将 ${VERSION_SERIES} 动态替换
#    为当前编译的 OpenWrt 主系列代号 (例如: 25.12)。
# 3. 若自定义源使用了独立数字签名，需将对应的公钥 (*.pub) 放置在 config/keys/ 目录下。
# 4. 当前没有额外仓库；SSR Plus 由 scripts/build-helloworld.sh 从源码构建。
# ==============================================================================
